<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>¡Feliz Cumpleaños Michelle! 🎂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Satisfy&family=Poppins:wght@300;400;600;700;900&family=Pacifico&display=swap"
    rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════════════════ */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Poppins', sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ═══════════════════════════════════════════════════════
       SCENES CONTAINER
    ═══════════════════════════════════════════════════════ */
    .scene {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 1;
    }

    .scene.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 10;
    }

    /* ═══════════════════════════════════════════════════════
       SCENE 1: MATRIX RAIN + COUNTDOWN
    ═══════════════════════════════════════════════════════ */
    #matrix-scene {
      background: #000;
    }

    #matrix-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .countdown-text {
      position: relative;
      z-index: 5;
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      color: #ff80bf;
      text-shadow:
        0 0 10px rgba(255, 105, 180, 0.6),
        0 0 25px rgba(255, 105, 180, 0.3);
      opacity: 0;
      transform: scale(0.3);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
    }

    .countdown-text.show {
      opacity: 1;
      transform: scale(1);
    }

    .countdown-text.hide {
      opacity: 0;
      transform: scale(1.6);
      transition: all 0.4s ease-in;
    }

    .countdown-number {
      font-size: clamp(80px, 18vw, 180px);
    }

    .countdown-word {
      font-size: clamp(38px, 9vw, 95px);
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    .countdown-name {
      font-size: clamp(48px, 11vw, 105px);
      font-family: 'Pacifico', cursive;
      letter-spacing: 2px;
      font-weight: 400;
      color: #ffd6ea;
      background: none;
      -webkit-background-clip: initial;
      -webkit-text-fill-color: initial;
      background-clip: initial;
      filter: none;
      text-shadow:
        0 0 8px rgba(255, 105, 180, 0.7),
        0 0 20px rgba(255, 105, 180, 0.35);
    }

    /* ═══════════════════════════════════════════════════════
       STARS BACKGROUND (Scenes 2-4)
    ═══════════════════════════════════════════════════════ */
    .stars-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, #0a0a2e 0%, #000 100%);
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.2;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.5);
      }
    }

    /* ═══════════════════════════════════════════════════════
       SCENE 2: CAT BIRTHDAY
    ═══════════════════════════════════════════════════════ */
    #cat-scene {
      flex-direction: column;
      gap: 20px;
    }

    .cat-container {
      position: relative;
      z-index: 5;
      text-align: center;
      animation: floatCat 3s ease-in-out infinite;
    }

    @keyframes floatCat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    .cat-emoji {
      font-size: clamp(100px, 25vw, 200px);
      display: block;
      filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
    }

    .birthday-candles {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .candle {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: candleGlow 1s ease-in-out infinite alternate;
    }

    .candle:nth-child(even) {
      animation-delay: 0.5s;
    }

    .flame {
      font-size: 24px;
      animation: flicker 0.3s ease-in-out infinite alternate;
    }

    @keyframes flicker {
      0% {
        transform: scaleY(1) rotate(-3deg);
      }

      100% {
        transform: scaleY(1.2) rotate(3deg);
      }
    }

    .candle-stick {
      width: 8px;
      height: 30px;
      border-radius: 2px;
    }

    @keyframes candleGlow {
      0% {
        filter: brightness(1);
      }

      100% {
        filter: brightness(1.3);
      }
    }

    .cat-birthday-text {
      font-family: 'Satisfy', cursive;
      font-size: clamp(24px, 6vw, 48px);
      color: #ff69b4;
      text-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
      margin-top: 20px;
      position: relative;
      z-index: 5;
    }

    .age-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ff69b4, #ff1493);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: clamp(28px, 7vw, 50px);
      width: clamp(60px, 15vw, 100px);
      height: clamp(60px, 15vw, 100px);
      line-height: clamp(60px, 15vw, 100px);
      border-radius: 50%;
      text-align: center;
      margin-top: 15px;
      box-shadow: 0 0 30px rgba(255, 105, 180, 0.6);
      animation: pulseBadge 2s ease-in-out infinite;
      position: relative;
      z-index: 5;
    }

    @keyframes pulseBadge {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 30px rgba(255, 105, 180, 0.6);
      }

      50% {
        transform: scale(1.1);
        box-shadow: 0 0 50px rgba(255, 105, 180, 0.8);
      }
    }

    .sparkle {
      position: absolute;
      font-size: 20px;
      animation: sparkleAnim 2s ease-in-out infinite;
      pointer-events: none;
      z-index: 3;
    }

    @keyframes sparkleAnim {

      0%,
      100% {
        opacity: 0;
        transform: scale(0) rotate(0deg);
      }

      50% {
        opacity: 1;
        transform: scale(1) rotate(180deg);
      }
    }

    .tap-hint {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.4);
      font-size: 14px;
      z-index: 5;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.3;
      }

      50% {
        opacity: 0.8;
      }
    }

    /* ═══════════════════════════════════════════════════════
       SCENE 3: 3D TWO-PAGE FLIPBOOK PHOTO ALBUM
    ═══════════════════════════════════════════════════════ */
    #album-scene {
      flex-direction: column;
      overflow: hidden;
      justify-content: center;
      align-items: center;
    }

    .album-wrapper {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      box-sizing: border-box;
    }

    .album-message {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 25px;
      padding: 6px 20px;
      margin-bottom: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      text-align: center;
      z-index: 10;
    }

    .album-message p {
      font-family: 'Satisfy', cursive;
      font-size: clamp(16px, 3.6vw, 22px);
      color: #333;
      margin: 0;
    }

    .album-message .emoji-icon {
      color: #ff69b4;
    }

    /* 3D BOOK STYLES */
    .book-container {
      position: relative;
      width: clamp(310px, 92vw, 640px);
      height: clamp(230px, 46vh, 400px);
      perspective: 1800px;
      perspective-origin: 50% 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px auto;
    }

    .book {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .book.closed {
      transform: translateX(-25%);
    }

    .book.open {
      transform: translateX(0);
    }

    /* Spine Crease & Book Under-shadow */
    .book-spine-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 14px;
      transform: translateX(-50%);
      background: linear-gradient(to right, rgba(0,0,0,0.22), rgba(0,0,0,0.03) 35%, rgba(255,255,255,0.2) 50%, rgba(0,0,0,0.03) 65%, rgba(0,0,0,0.22));
      z-index: 45;
      pointer-events: none;
    }

    .book-base {
      position: absolute;
      top: 0;
      height: 100%;
      width: 50%;
      background: #faf7f5;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .book-base-left {
      left: 0;
      border-radius: 12px 3px 3px 12px;
      border-left: 4px solid #ad1457;
      box-shadow: inset -16px 0 22px rgba(0,0,0,0.1), 0 12px 30px rgba(0,0,0,0.4);
    }

    .book-base-right {
      left: 50%;
      border-radius: 3px 12px 12px 3px;
      border-right: 4px solid #ad1457;
      box-shadow: inset 16px 0 22px rgba(0,0,0,0.1), 0 12px 30px rgba(0,0,0,0.4);
    }

    .book-inner-lining {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fce4ec, #f8bbd0);
      color: #ad1457;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
    }

    .lining-icon {
      font-size: clamp(28px, 6vw, 42px);
      margin-bottom: 6px;
    }

    .lining-text {
      font-family: 'Satisfy', cursive;
      font-size: clamp(14px, 3.2vw, 20px);
      color: #880e4f;
      margin: 0;
    }

    .lining-badge {
      margin-top: 8px;
      font-size: 11px;
      font-weight: 700;
      color: #c2185b;
      background: rgba(255, 255, 255, 0.6);
      padding: 3px 10px;
      border-radius: 10px;
    }

    /* 3D Flappable Leaves */
    .book-leaf {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 0.75s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .book-leaf.flipped {
      transform: rotateY(-180deg);
    }

    .page-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .page-front {
      transform: rotateY(0deg);
      border-radius: 2px 12px 12px 2px;
      border-right: 2px solid #e8e0e4;
      background: #ffffff;
      box-shadow: inset 18px 0 22px rgba(0, 0, 0, 0.08), 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    .page-back {
      transform: rotateY(180deg);
      border-radius: 12px 2px 2px 12px;
      border-left: 2px solid #e8e0e4;
      background: #ffffff;
      box-shadow: inset -18px 0 22px rgba(0, 0, 0, 0.08), 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    /* Cover Page Styling */
    .cover-face {
      background: linear-gradient(135deg, #e91e63 0%, #c2185b 50%, #880e4f 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 14px 10px;
      border: 3px solid rgba(255, 215, 0, 0.6);
      outline: 1px solid rgba(255, 215, 0, 0.35);
      outline-offset: -5px;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.35), 0 10px 30px rgba(0,0,0,0.5);
    }

    .cover-badge {
      font-size: clamp(32px, 7vw, 46px);
      margin-bottom: 6px;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
    }

    .cover-title {
      font-family: 'Pacifico', cursive;
      font-size: clamp(20px, 4.6vw, 32px);
      margin-bottom: 4px;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .cover-sub {
      font-size: clamp(11px, 2.6vw, 14px);
      opacity: 0.95;
      font-weight: 600;
      letter-spacing: 1px;
      color: #ffd6ea;
      margin-bottom: 12px;
    }

    .cover-hint {
      background: rgba(255, 255, 255, 0.25);
      border: 1px dashed rgba(255, 255, 255, 0.7);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: clamp(11px, 2.4vw, 13px);
      animation: pulse 1.8s ease-in-out infinite;
    }

    /* Photo Page Styling */
    .photo-page-content {
      width: 100%;
      height: 100%;
      padding: 7px 7px 18px 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #faf8f7;
      position: relative;
      box-sizing: border-box;
    }

    .photo-frame {
      width: 100%;
      flex: 1;
      border-radius: 6px;
      overflow: hidden;
      background: #f0f0f0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .page-caption {
      margin-top: 5px;
      font-family: 'Satisfy', cursive;
      font-size: clamp(11px, 2.6vw, 16px);
      color: #333;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 95%;
    }

    .page-number-tag {
      position: absolute;
      bottom: 4px;
      font-size: 10px;
      color: #999;
      font-weight: 600;
    }

    .page-front .page-number-tag {
      right: 8px;
    }

    .page-back .page-number-tag {
      left: 8px;
    }

    .page-zoom-hint {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      backdrop-filter: blur(4px);
      opacity: 0.85;
      transition: opacity 0.2s, transform 0.2s;
    }

    .page-zoom-hint:hover {
      transform: scale(1.15);
      opacity: 1;
    }

    /* Final Surprise Page */
    .final-page-content {
      background: linear-gradient(135deg, #1f0b29 0%, #3a1142 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 14px 10px;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    .final-page-title {
      font-family: 'Pacifico', cursive;
      font-size: clamp(15px, 3.4vw, 22px);
      color: #ff80ab;
      margin-bottom: 5px;
    }

    .final-page-text {
      font-size: clamp(11px, 2.3vw, 13px);
      color: rgba(255, 255, 255, 0.88);
      margin-bottom: 12px;
      line-height: 1.4;
      padding: 0 4px;
    }

    .final-page-btn {
      background: linear-gradient(135deg, #ff4081, #ff1744);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 50px;
      font-size: clamp(12px, 2.5vw, 14px);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(255, 23, 68, 0.65);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .final-page-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 22px rgba(255, 23, 68, 0.8);
    }

    /* Navigation Buttons */
    .book-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.45);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 55;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
      user-select: none;
      -webkit-user-select: none;
    }

    .book-nav-btn:hover {
      background: rgba(255, 105, 180, 0.7);
      transform: translateY(-50%) scale(1.1);
    }

    .book-nav-btn:disabled {
      opacity: 0.25;
      cursor: default;
      pointer-events: none;
    }

    .prev-btn {
      left: -14px;
    }

    .next-btn {
      right: -14px;
    }

    .book-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      z-index: 20;
    }

    .page-counter {
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      font-weight: 600;
      background: rgba(0, 0, 0, 0.35);
      padding: 3px 14px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }

    .swipe-indicator {
      margin-top: 3px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 11px;
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 6px;
      animation: swipeHint 2s ease-in-out infinite;
    }

    @keyframes swipeHint {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-6px); }
    }

    .dots-indicator {
      display: flex;
      gap: 6px;
      z-index: 15;
      align-items: center;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.active {
      background: #ff4081;
      width: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(255, 64, 129, 0.7);
    }

    /* ═══════════════════════════════════════════════════════
       SCENE 4: HEART & 25 MORPHING COLLAGE
    ═══════════════════════════════════════════════════════ */
    #collage-scene {
      flex-direction: column;
      gap: 15px;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .collage-container {
      position: relative;
      z-index: 5;
      width: clamp(300px, 92vw, 540px);
      height: clamp(300px, 62vh, 480px);
    }

    .collage-photo {
      position: absolute;
      width: clamp(50px, 13.5vw, 76px);
      height: clamp(50px, 13.5vw, 76px);
      background: #fff;
      border-radius: 12px;
      padding: 3.5px;
      box-shadow:
        0 0 12px rgba(255, 105, 180, 0.65),
        0 0 25px rgba(255, 105, 180, 0.3);
      opacity: 0;
      transform: scale(0) rotate(var(--rot, 0deg));
      /* Smooth morphing transition when moving between Heart and 25 */
      transition: left 1.1s cubic-bezier(0.34, 1.25, 0.64, 1),
                  top 1.1s cubic-bezier(0.34, 1.25, 0.64, 1),
                  transform 1.1s cubic-bezier(0.34, 1.25, 0.64, 1),
                  opacity 0.4s ease,
                  box-shadow 0.3s ease;
      overflow: hidden;
      will-change: left, top, transform;
      cursor: pointer;
    }

    .collage-photo.show {
      opacity: 1;
      transform: scale(1) rotate(var(--rot, 0deg));
    }

    .collage-photo:hover, .collage-photo:active {
      transform: scale(1.18) rotate(0deg) !important;
      z-index: 99 !important;
      box-shadow: 0 0 25px rgba(255, 105, 180, 0.95), 0 0 45px rgba(255, 105, 180, 0.5);
    }

    .collage-photo .collage-img {
      width: 100%;
      height: 100%;
      border-radius: 9px;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .collage-title {
      position: relative;
      z-index: 5;
      font-family: 'Satisfy', cursive;
      font-size: clamp(24px, 6vw, 40px);
      color: #ff85c2;
      text-shadow:
        0 0 12px rgba(255, 105, 180, 0.6),
        0 0 25px rgba(255, 105, 180, 0.3);
      text-align: center;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      line-height: 1.3;
    }

    .collage-title.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ═══════════════════════════════════════════════════════
       PHOTO MODAL (LIGHTBOX)
    ═══════════════════════════════════════════════════════ */
    .photo-modal {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
    }

    .photo-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .photo-modal-backdrop {
      position: absolute;
      inset: 0;
    }

    .photo-modal-content {
      position: relative;
      background: #fff;
      padding: 10px 10px 35px 10px;
      border-radius: 14px;
      box-shadow: 0 0 35px rgba(255, 105, 180, 0.8);
      max-width: 90vw;
      max-height: 82vh;
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 2;
    }

    .photo-modal.open .photo-modal-content {
      transform: scale(1);
    }

    .photo-modal-content img {
      max-width: 82vw;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 8px;
      display: block;
    }

    .photo-modal-close {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 34px;
      height: 34px;
      background: #ff1493;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 0 15px rgba(255, 20, 147, 0.8);
      transition: transform 0.2s ease;
    }

    .photo-modal-close:hover {
      transform: scale(1.1);
    }

    /* ═══════════════════════════════════════════════════════
       FLOATING EMOJIS (decoration — no hearts)
    ═══════════════════════════════════════════════════════ */
    .floating-emojis {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      overflow: hidden;
    }

    .floating-emoji {
      position: absolute;
      bottom: -30px;
      font-size: 20px;
      animation: floatUp var(--dur) ease-in forwards;
      animation-delay: var(--delay);
      opacity: 0;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translateY(0) rotate(0deg) scale(0.5);
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translateY(-100vh) rotate(720deg) scale(1);
      }
    }

    /* ═══════════════════════════════════════════════════════
       AUDIO BUTTON
    ═══════════════════════════════════════════════════════ */
    .audio-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 999;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(255, 105, 180, 0.5);
      background: rgba(0, 0, 0, 0.5);
      color: #ff69b4;
      font-size: 18px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .audio-btn.visible {
      display: flex;
    }

    .audio-btn:hover {
      border-color: #ff69b4;
      background: rgba(255, 105, 180, 0.2);
    }

    /* ═══════════════════════════════════════════════════════
       START SCREEN
    ═══════════════════════════════════════════════════════ */
    #start-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #1a0a1a 0%, #000 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease;
    }

    #start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-envelope {
      font-size: 80px;
      margin-bottom: 30px;
      animation: envelopeBounce 2s ease-in-out infinite;
    }

    @keyframes envelopeBounce {

      0%,
      100% {
        transform: translateY(0) rotate(-5deg);
      }

      50% {
        transform: translateY(-15px) rotate(5deg);
      }
    }

    .start-text {
      font-family: 'Satisfy', cursive;
      font-size: clamp(22px, 5vw, 32px);
      color: #ff69b4;
      margin-bottom: 30px;
      text-shadow: 0 0 20px rgba(255, 105, 180, 0.5);
    }

    .start-btn {
      background: linear-gradient(135deg, #ff69b4, #ff1493);

      padding: 15px 40px;

    /* ═══════════════════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════════════════ */
    @media (max-width: 480px) {
      .photo-stack {

        margin-bottom: 15px;
      }

      .collage-container {
        gap: 5px;
        padding: 5px;
      }

  </style>
</head>

  <!-- PHOTO MODAL (LIGHTBOX) -->

  <script>
    /* ═══════════════════════════════════════════════════════
       CONFIGURATION
    ═══════════════════════════════════════════════════════ */

    const PHOTO_DIR = 'michelle-fotos/';

    const ALBUM_PHOTOS = [
      { src: PHOTO_DIR + '1.jpeg', caption: 'Siempre brillando ✨' },
      { src: PHOTO_DIR + '2.jpeg', caption: 'Momentos increíbles 🌟' },
      { src: PHOTO_DIR + '3.jpeg', caption: 'La mejor sonrisa 😊' },
      { src: PHOTO_DIR + '4.jpeg', caption: 'Siempre pasándola bien 🎉' },
      { src: PHOTO_DIR + '5.jpeg', caption: 'Recuerdos bonitos 🌸' },
      { src: PHOTO_DIR + '6.jpeg', caption: 'Eres increíble 🥳' },
      { src: PHOTO_DIR + '7.jpeg', caption: 'Que linda 🌺' },
      { src: PHOTO_DIR + '8.jpeg', caption: 'Pura buena vibra ☀️' },
      { src: PHOTO_DIR + '9.jpeg', caption: 'Siempre feliz 🎊' },
      { src: PHOTO_DIR + '10.jpeg', caption: '¡Feliz cumple! 🎂' },
    ];

    // Photos array for collage
    const COLLAGE_PHOTOS = [
      PHOTO_DIR + '1.jpeg', PHOTO_DIR + '2.jpeg', PHOTO_DIR + '3.jpeg',
      PHOTO_DIR + '4.jpeg', PHOTO_DIR + '5.jpeg', PHOTO_DIR + '6.jpeg',
      PHOTO_DIR + '7.jpeg', PHOTO_DIR + '8.jpeg', PHOTO_DIR + '9.jpeg',
      PHOTO_DIR + '10.jpeg'
    ];

    /* ═══════════════════════════════════════════════════════
       GLOBALS
    ═══════════════════════════════════════════════════════ */
    let currentScene = 0;
    let matrixAnimId = null;
    let musicPlaying = false;

    /* ═══════════════════════════════════════════════════════
       AUDIO CONTROL
    ═══════════════════════════════════════════════════════ */
    function startMusic() {
      const audio = document.getElementById('bg-music');
      const btn = document.getElementById('audio-btn');
      audio.volume = 0.5;
      audio.play().then(() => {
        musicPlaying = true;
        btn.classList.add('visible');
        btn.textContent = '🔊';
      }).catch(() => {
        // Autoplay blocked — will try again on next interaction
        btn.classList.add('visible');
        btn.textContent = '🔇';
      });
    }

    function toggleMusic() {
      const audio = document.getElementById('bg-music');
      const btn = document.getElementById('audio-btn');
      if (audio.paused) {
        audio.play();
        btn.textContent = '🔊';
        musicPlaying = true;
      } else {
        audio.pause();
        btn.textContent = '🔇';
        musicPlaying = false;
      }
    }

    /* ═══════════════════════════════════════════════════════
       UTILITY: Generate Stars
    ═══════════════════════════════════════════════════════ */
    function generateStars(containerId, count = 150) {
      const container = document.getElementById(containerId);
      if (!container) return;
      for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
        star.style.setProperty('--delay', (Math.random() * 5) + 's');
        star.style.width = (1 + Math.random() * 2) + 'px';
        star.style.height = star.style.width;
        container.appendChild(star);
      }
    }

    /* ═══════════════════════════════════════════════════════
       UTILITY: Floating Emojis (no hearts)
    ═══════════════════════════════════════════════════════ */
    function launchEmojis(count = 20) {
      const container = document.getElementById('floating-emojis');
      const emojis = ['✨', '🌟', '🎉', '🎊', '🥳', '🌸', '🎀', '⭐', '🎂', '🌺'];
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'floating-emoji';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + '%';
        el.style.setProperty('--dur', (4 + Math.random() * 4) + 's');
        el.style.setProperty('--delay', (Math.random() * 3) + 's');
        el.style.fontSize = (14 + Math.random() * 20) + 'px';
        container.appendChild(el);
        setTimeout(() => el.remove(), 10000);
      }
    }

    /* ═══════════════════════════════════════════════════════
       UTILITY: Sparkles
    ═══════════════════════════════════════════════════════ */
    function createSparkles(parent, count = 15) {
      const emojis = ['✨', '⭐', '🌟', '💫'];
      for (let i = 0; i < count; i++) {
        const sparkle = document.createElement('span');
        sparkle.className = 'sparkle';
        sparkle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        sparkle.style.left = Math.random() * 100 + '%';
        sparkle.style.top = Math.random() * 100 + '%';
        sparkle.style.animationDelay = (Math.random() * 3) + 's';
        sparkle.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        parent.appendChild(sparkle);
      }
    }

    /* ═══════════════════════════════════════════════════════
       SCENE MANAGER
    ═══════════════════════════════════════════════════════ */
    function showScene(sceneId) {
      document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
      const scene = document.getElementById(sceneId);
      if (scene) {
        scene.classList.add('active');
      }
    }

    /* ═══════════════════════════════════════════════════════
       SCENE 1: MATRIX RAIN
    ═══════════════════════════════════════════════════════ */
    function initMatrix() {
      const canvas = document.getElementById('matrix-canvas');
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ★☆';
      const fontSize = 14;
      const columns = Math.floor(canvas.width / fontSize);
      const drops = new Array(columns).fill(1);

      for (let i = 0; i < drops.length; i++) {
        drops[i] = Math.floor(Math.random() * -50);
      }

      function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < drops.length; i++) {
          const char = chars[Math.floor(Math.random() * chars.length)];
          const x = i * fontSize;
          const y = drops[i] * fontSize;

          const pinkShade = Math.random();
          if (pinkShade > 0.7) {
            ctx.fillStyle = '#ff69b4';
          } else if (pinkShade > 0.4) {
            ctx.fillStyle = '#ff1493';
          } else {
            ctx.fillStyle = '#c71585';
          }

          if (Math.random() > 0.95) {
            ctx.fillStyle = '#ffb6c1';
            ctx.shadowColor = '#ff69b4';
            ctx.shadowBlur = 15;
          } else {
            ctx.shadowBlur = 0;
          }

          ctx.font = fontSize + 'px monospace';
          ctx.fillText(char, x, y);
          ctx.shadowBlur = 0;

          if (y > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }

        matrixAnimId = requestAnimationFrame(drawMatrix);
      }

      drawMatrix();
    }

    /* ═══════════════════════════════════════════════════════
       COUNTDOWN SEQUENCE
    ═══════════════════════════════════════════════════════ */
    function runCountdown() {
      const display = document.getElementById('countdown-display');
      const sequence = [
        { text: '3', className: 'countdown-number', delay: 1000 },
        { text: '2', className: 'countdown-number', delay: 1800 },
        { text: '1', className: 'countdown-number', delay: 2600 },
        { text: 'FELIZ', className: 'countdown-word', delay: 3600 },
        { text: 'CUMPLEAÑOS', className: 'countdown-word', delay: 5000 },
        { text: 'PARA', className: 'countdown-word', delay: 6500 },
        { text: 'michelle', className: 'countdown-name', delay: 7800 },
      ];

      sequence.forEach((item, index) => {
        setTimeout(() => {
          display.textContent = item.text;
          display.className = 'countdown-text ' + item.className;
          void display.offsetWidth;
          display.classList.add('show');
        }, item.delay);

        const hideDelay = index < sequence.length - 1
          ? item.delay + 800
          : item.delay + 2500;

        setTimeout(() => {
          display.classList.remove('show');
          display.classList.add('hide');
        }, hideDelay);
      });

      // Transition to cat scene
      setTimeout(() => {
        if (matrixAnimId) cancelAnimationFrame(matrixAnimId);
        showScene('cat-scene');
        launchEmojis(30);
        createSparkles(document.getElementById('cat-scene'), 20);
      }, 11000);
    }

    /* ═══════════════════════════════════════════════════════
       SCENE 2: CAT SCENE CLICK HANDLER
    ═══════════════════════════════════════════════════════ */
    function initCatScene() {
      const catScene = document.getElementById('cat-scene');
      let transitioned = false;

      function goToAlbum() {
        if (transitioned) return;
        transitioned = true;
        showScene('album-scene');
        flipTo(0);
      }

      catScene.addEventListener('click', goToAlbum);
      catScene.addEventListener('touchend', (e) => {
        e.preventDefault();
        goToAlbum();
      });
    }

    /* ═══════════════════════════════════════════════════════
       SCENE 3: 3D TWO-PAGE FLIPBOOK PHOTO ALBUM
    ═══════════════════════════════════════════════════════ */
    let currentSpread = 0; // 0: Portada, 1: Págs 1-2, 2: Págs 3-4, 3: Págs 5-6, 4: Págs 7-8, 5: Págs 9-10, 6: Sorpresa Final
    const totalSpreads = 7;
    let bookLeaves = [];
    let isFlipping = false;

    function createPhotoFace(photo, isFront, pageNumber) {
      const face = document.createElement('div');
      face.className = `page-face ${isFront ? 'page-front' : 'page-back'}`;

      const content = document.createElement('div');
      content.className = 'photo-page-content';

      const frame = document.createElement('div');
      frame.className = 'photo-frame';

      const img = document.createElement('img');
      img.src = photo.src;
      img.alt = photo.caption;
      img.draggable = false;
      frame.appendChild(img);

      // Tap-to-zoom button
      const zoomHint = document.createElement('div');
      zoomHint.className = 'page-zoom-hint';
      zoomHint.innerHTML = '🔍';
      zoomHint.title = 'Toca para ampliar foto';
      zoomHint.addEventListener('click', (e) => {
        e.stopPropagation();
        openPhotoModal(photo.src);
      });
      frame.appendChild(zoomHint);

      // Tapping frame directly enlarges photo
      frame.addEventListener('click', (e) => {
        e.stopPropagation();
        openPhotoModal(photo.src);
      });

      const caption = document.createElement('div');
      caption.className = 'page-caption';
      caption.textContent = photo.caption;

      const numTag = document.createElement('div');
      numTag.className = 'page-number-tag';
      numTag.textContent = `Pág ${pageNumber}`;

      content.appendChild(frame);
      content.appendChild(caption);
      content.appendChild(numTag);
      face.appendChild(content);

      return face;
    }

    function buildBookAlbum() {
      const book = document.getElementById('book');
      const dotsContainer = document.getElementById('dots-indicator');
      if (!book) return;

      book.innerHTML = '';
      bookLeaves = [];
      currentSpread = 0;

      // 1. Static Left Base (Inside lining when opened)
      const baseLeft = document.createElement('div');
      baseLeft.className = 'book-base book-base-left';
      baseLeft.innerHTML = `
        <div class="book-inner-lining">
          <div class="lining-icon">🌸</div>
          <p class="lining-text">Recuerdos con Michelle ✨</p>
          <span class="lining-badge">25 Años Inolvidables</span>
        </div>
      `;
      book.appendChild(baseLeft);

      // 2. Static Right Base (Final Surprise page when last leaf is flipped)
      const baseRight = document.createElement('div');
      baseRight.className = 'book-base book-base-right';
      baseRight.innerHTML = `
        <div class="final-page-content">
          <span style="font-size:clamp(28px, 6vw, 38px); margin-bottom:4px;">🎁</span>
          <div class="final-page-title">¡Una Sorpresa Más!</div>
          <div class="final-page-text">
            Michelle, aquí no termina todo... Descubre el mosaico mágico con todas tus fotos juntas en forma de corazón y el número 25 ✨
          </div>
          <button class="final-page-btn" id="final-to-collage-btn">Ver Mosaico Mágico 💖</button>
        </div>
      `;
      book.appendChild(baseRight);

      // 3. Central Spine Line
      const spine = document.createElement('div');
      spine.className = 'book-spine-line';
      book.appendChild(spine);

      // 4. Create 6 3D Leaves (Leaf 0 to 5)
      // Leaf 0: Front = Portada, Back = Foto 1
      const leaf0 = document.createElement('div');
      leaf0.className = 'book-leaf';

      const front0 = document.createElement('div');
      front0.className = 'page-face page-front cover-face';
      front0.innerHTML = `
        <div class="cover-badge">🎂</div>
        <div class="cover-title">Michelle</div>
        <div class="cover-sub">25 AÑOS • ÁLBUM DE RECUERDOS</div>
        <div class="cover-hint">👉 Desliza o toca para abrir</div>
      `;
      const back0 = createPhotoFace(ALBUM_PHOTOS[0], false, 1);
      leaf0.appendChild(front0);
      leaf0.appendChild(back0);
      book.appendChild(leaf0);
      bookLeaves.push(leaf0);

      // Leaf 1: Front = Foto 2, Back = Foto 3
      const leaf1 = document.createElement('div');
      leaf1.className = 'book-leaf';
      leaf1.appendChild(createPhotoFace(ALBUM_PHOTOS[1], true, 2));
      leaf1.appendChild(createPhotoFace(ALBUM_PHOTOS[2], false, 3));
      book.appendChild(leaf1);
      bookLeaves.push(leaf1);

      // Leaf 2: Front = Foto 4, Back = Foto 5
      const leaf2 = document.createElement('div');
      leaf2.className = 'book-leaf';
      leaf2.appendChild(createPhotoFace(ALBUM_PHOTOS[3], true, 4));
      leaf2.appendChild(createPhotoFace(ALBUM_PHOTOS[4], false, 5));
      book.appendChild(leaf2);
      bookLeaves.push(leaf2);

      // Leaf 3: Front = Foto 6, Back = Foto 7
      const leaf3 = document.createElement('div');
      leaf3.className = 'book-leaf';
      leaf3.appendChild(createPhotoFace(ALBUM_PHOTOS[5], true, 6));
      leaf3.appendChild(createPhotoFace(ALBUM_PHOTOS[6], false, 7));
      book.appendChild(leaf3);
      bookLeaves.push(leaf3);

      // Leaf 4: Front = Foto 8, Back = Foto 9
      const leaf4 = document.createElement('div');
      leaf4.className = 'book-leaf';
      leaf4.appendChild(createPhotoFace(ALBUM_PHOTOS[7], true, 8));
      leaf4.appendChild(createPhotoFace(ALBUM_PHOTOS[8], false, 9));
      book.appendChild(leaf4);
      bookLeaves.push(leaf4);

      // Leaf 5: Front = Foto 10, Back = Mensaje Final
      const leaf5 = document.createElement('div');
      leaf5.className = 'book-leaf';
      leaf5.appendChild(createPhotoFace(ALBUM_PHOTOS[9], true, 10));

      const back5 = document.createElement('div');
      back5.className = 'page-face page-back';
      back5.innerHTML = `
        <div class="photo-page-content" style="background:#fff7fa; justify-content:center; text-align:center; padding:16px;">
          <div style="font-size:clamp(30px, 6vw, 42px); margin-bottom:6px;">✨</div>
          <div style="font-family:'Pacifico', cursive; font-size:clamp(16px, 3.6vw, 24px); color:#c2185b; margin-bottom:8px;">
            ¡Felices 25 Años!
          </div>
          <p style="font-family:'Satisfy', cursive; font-size:clamp(13px, 2.8vw, 17px); color:#444; line-height:1.45; margin:0 0 10px 0;">
            Que cada día de este nuevo año te traiga sonrisas, momentos mágicos y toda la felicidad que mereces. ¡Sigue brillando como siempre! 🌸💖
          </p>
          <span style="font-size:11px; font-weight:700; color:#ad1457; letter-spacing:1px;">MICHELLE • 2026</span>
          <div class="page-number-tag" style="left:8px;">Fin</div>
        </div>
      `;
      leaf5.appendChild(back5);
      book.appendChild(leaf5);
      bookLeaves.push(leaf5);

      // Set initial natural z-indices (Leaf 0 on top on right)
      bookLeaves.forEach((leaf, idx) => {
        leaf.style.zIndex = (bookLeaves.length - idx) * 2;
      });

      // 5. Generate Dots Indicator
      if (dotsContainer) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSpreads; i++) {
          const dot = document.createElement('div');
          dot.className = 'dot' + (i === 0 ? ' active' : '');
          dot.title = (i === 0) ? 'Portada' : (i === 6 ? 'Sorpresa Final' : `Páginas ${i * 2 - 1}-${i * 2}`);
          dot.addEventListener('click', (e) => {
            e.stopPropagation();
            flipTo(i);
          });
          dotsContainer.appendChild(dot);
        }
      }

      // Initial Spread state
      updateSpreadUI(0);
    }

    function updateSpreadUI(targetSpread) {
      const book = document.getElementById('book');
      const counter = document.getElementById('page-counter');
      const prevBtn = document.getElementById('book-prev-btn');
      const dots = document.querySelectorAll('.dots-indicator .dot');

      if (!book) return;

      if (targetSpread === 0) {
        book.classList.add('closed');
        book.classList.remove('open');
        if (counter) counter.textContent = 'Portada 📖 (Toca o desliza para abrir)';
        if (prevBtn) prevBtn.disabled = true;
      } else {
        book.classList.remove('closed');
        book.classList.add('open');
        if (prevBtn) prevBtn.disabled = false;

        if (counter) {
          if (targetSpread === 1) counter.textContent = 'Páginas 1 - 2 de 10';
          else if (targetSpread === 2) counter.textContent = 'Páginas 3 - 4 de 10';
          else if (targetSpread === 3) counter.textContent = 'Páginas 5 - 6 de 10';
          else if (targetSpread === 4) counter.textContent = 'Páginas 7 - 8 de 10';
          else if (targetSpread === 5) counter.textContent = 'Páginas 9 - 10 de 10';
          else if (targetSpread === 6) counter.textContent = 'Sorpresa Final 🎁';
        }
      }

      dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === targetSpread);
      });
    }

    function flipTo(targetSpread) {
      if (targetSpread < 0) return;
      if (targetSpread >= totalSpreads) {
        // User flipped past final spread -> go to Scene 4 (mosaic collage)
        showScene('collage-scene');
        initCollage();
        launchEmojis(30);
        return;
      }
      if (targetSpread === currentSpread || isFlipping) return;

      isFlipping = true;
      const movingForward = targetSpread > currentSpread;
      const oldSpread = currentSpread;
      currentSpread = targetSpread;

      // Animate leaves with elevated z-index so they swing above stationary pages
      if (movingForward) {
        for (let i = oldSpread; i < targetSpread; i++) {
          if (bookLeaves[i]) {
            bookLeaves[i].style.zIndex = 40 + i;
            bookLeaves[i].classList.add('flipped');
          }
        }
      } else {
        for (let i = oldSpread - 1; i >= targetSpread; i--) {
          if (bookLeaves[i]) {
            bookLeaves[i].style.zIndex = 40 + (bookLeaves.length - i);
            bookLeaves[i].classList.remove('flipped');
          }
        }
      }

      updateSpreadUI(targetSpread);

      // Settle natural z-index stacking after 3D flip animation completes
      setTimeout(() => {
        bookLeaves.forEach((leaf, i) => {
          if (i < currentSpread) {
            // Resting on left
            leaf.style.zIndex = (i + 1) * 2;
          } else {
            // Resting on right
            leaf.style.zIndex = (bookLeaves.length - i) * 2;
          }
        });
        isFlipping = false;
      }, 760);
    }

    function initBookInteraction() {
      const container = document.getElementById('book-container');
      const prevBtn = document.getElementById('book-prev-btn');
      const nextBtn = document.getElementById('book-next-btn');

      if (prevBtn) {
        prevBtn.onclick = (e) => {
          e.stopPropagation();
          flipTo(currentSpread - 1);
        };
      }

      if (nextBtn) {
        nextBtn.onclick = (e) => {
          e.stopPropagation();
          flipTo(currentSpread + 1);
        };
      }

      // Touch swipe gestures
      let touchStartX = 0;
      let touchStartY = 0;
      let touchStartTime = 0;

      container.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        touchStartTime = Date.now();
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;
        const dt = Date.now() - touchStartTime;

        if (Math.abs(dx) > 35 && Math.abs(dx) > Math.abs(dy) && dt < 600) {
          if (dx < 0) {
            // Swipe left -> flip forward
            flipTo(currentSpread + 1);
          } else {
            // Swipe right -> flip backward
            flipTo(currentSpread - 1);
          }
        }
      }, { passive: true });

      // Mouse drag for desktop
      let mouseStartX = 0;
      let isMouseDown = false;

      container.addEventListener('mousedown', (e) => {
        if (e.target.closest('button') || e.target.closest('.page-zoom-hint')) return;
        mouseStartX = e.clientX;
        isMouseDown = true;
      });

      window.addEventListener('mouseup', (e) => {
        if (!isMouseDown) return;
        isMouseDown = false;
        const dx = e.clientX - mouseStartX;
        if (Math.abs(dx) > 40) {
          if (dx < 0) {
            flipTo(currentSpread + 1);
          } else {
            flipTo(currentSpread - 1);
          }
        }
      });

      // Tapping on page margins to turn pages
      container.addEventListener('click', (e) => {
        if (e.target.closest('button') || e.target.closest('.page-zoom-hint') || e.target.closest('.photo-frame')) return;

        const rect = container.getBoundingClientRect();
        const clickX = e.clientX - rect.left;

        if (currentSpread === 0) {
          // Closed cover clicked -> open
          flipTo(1);
        } else {
          if (clickX > rect.width * 0.5) {
            flipTo(currentSpread + 1);
          } else {
            flipTo(currentSpread - 1);
          }
        }
      });

      // Final surprise button inside Right Base
      document.addEventListener('click', (e) => {
        if (e.target && e.target.id === 'final-to-collage-btn') {
          e.stopPropagation();
          showScene('collage-scene');
          initCollage();
          launchEmojis(30);
        }
      });

      // Keyboard arrow navigation
      document.addEventListener('keydown', (e) => {
        const albumScene = document.getElementById('album-scene');
        if (!albumScene || !albumScene.classList.contains('active')) return;
        if (e.key === 'ArrowRight' || e.key === ' ') {
          flipTo(currentSpread + 1);
        } else if (e.key === 'ArrowLeft') {
          flipTo(currentSpread - 1);
        }
      });
    }

    /* ═══════════════════════════════════════════════════════
       SCENE 4: HEART ⇄ 25 MORPHING COLLAGE (EVERY 4 SECONDS)
    ═══════════════════════════════════════════════════════ */
    let currentCollageShape = 'heart';
    let morphIntervalId = null;
    let collageCardElements = [];

    function calculateHeartPoints(W, H, cardW, cardH) {
      const centerX = W / 2;
      const centerY = H / 2;
      const scale = Math.min(W, H) / 40;
      const totalPerimeter = 18;
      const points = [];

      for (let i = 0; i < totalPerimeter; i++) {
        const t = (i / totalPerimeter) * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        points.push({
          x: centerX + x * scale - cardW / 2,
          y: centerY + (y - 0.5) * scale - cardH / 2,
          rot: -7 + Math.random() * 14
        });
      }

      // 2 center cards so heart is full
      points.push({
        x: centerX - cardW / 2,
        y: centerY - 1.8 * scale - cardH / 2,
        rot: -3 + Math.random() * 6
      });
      points.push({
        x: centerX - cardW / 2,
        y: centerY + 1.2 * scale - cardH / 2,
        rot: -4 + Math.random() * 8
      });

      return points;
    }

    function calculate25Points(W, H, cardW, cardH) {
      const centerX = W / 2;
      const centerY = H / 2;
      const s = Math.min(W, H) / 38;
      const dx2 = centerX - Math.min(W * 0.22, 110);
      const dx5 = centerX + Math.min(W * 0.22, 110);
      const points = [];

      // Digit "2" - 10 cards
      const coords2 = [
        { x: -7.5 * s, y: -9 * s },
        { x: -5 * s, y: -13 * s },
        { x: 1 * s, y: -14.5 * s },
        { x: 7 * s, y: -11 * s },
        { x: 6.5 * s, y: -4 * s },
        { x: 1 * s, y: 1.5 * s },
        { x: -4 * s, y: 7 * s },
        { x: -7.5 * s, y: 12.5 * s },
        { x: 0 * s, y: 13.5 * s },
        { x: 7.5 * s, y: 13.5 * s }
      ];

      coords2.forEach(c => {
        points.push({
          x: dx2 + c.x - cardW / 2,
          y: centerY + c.y - cardH / 2,
          rot: -5 + Math.random() * 10
        });
      });

      // Digit "5" - 10 cards
      const coords5 = [
        { x: 7.5 * s, y: -14.5 * s },
        { x: 0 * s, y: -14.5 * s },
        { x: -7 * s, y: -14.5 * s },
        { x: -6.5 * s, y: -7.5 * s },
        { x: -4 * s, y: -0.5 * s },
        { x: 3.5 * s, y: 0.5 * s },
        { x: 8 * s, y: 6.5 * s },
        { x: 5.5 * s, y: 12.5 * s },
        { x: -1 * s, y: 14 * s },
        { x: -6.5 * s, y: 12 * s }
      ];

      coords5.forEach(c => {
        points.push({
          x: dx5 + c.x - cardW / 2,
          y: centerY + c.y - cardH / 2,
          rot: -5 + Math.random() * 10
        });
      });

      return points;
    }

    function applyCollageShape(shapeName) {
      const container = document.getElementById('collage-container');
      const title = document.getElementById('collage-title');
      const W = container.clientWidth;
      const H = container.clientHeight;
      const cardW = Math.min(Math.max(50, W * 0.135), 76);
      const cardH = cardW;

      currentCollageShape = shapeName;
      const points = (shapeName === 'heart')
        ? calculateHeartPoints(W, H, cardW, cardH)
        : calculate25Points(W, H, cardW, cardH);

      collageCardElements.forEach((div, index) => {
        const pt = points[index % points.length];
        div.style.left = pt.x + 'px';
        div.style.top = pt.y + 'px';
        div.style.setProperty('--rot', pt.rot + 'deg');
      });

      title.style.opacity = '0';
      title.style.transform = 'translateY(15px)';
      setTimeout(() => {
        if (shapeName === 'heart') {
          title.innerHTML = '¡Que sean muchos más! 🥳🎉<br>Michelle 🎂';
        } else {
          title.innerHTML = '¡Felices 25 Michelle! 🎂✨<br>25 años increíbles 🌸';
        }
        title.style.opacity = '1';
        title.style.transform = 'translateY(0)';
      }, 350);
    }

    function openPhotoModal(src) {
      const modal = document.getElementById('photo-modal');
      const modalImg = document.getElementById('modal-img');
      modalImg.src = src;
      modal.classList.add('open');
    }

    function closePhotoModal() {
      const modal = document.getElementById('photo-modal');
      modal.classList.remove('open');
    }

    function initCollage() {
      const container = document.getElementById('collage-container');
      const title = document.getElementById('collage-title');
      container.innerHTML = '';
      collageCardElements = [];
      if (morphIntervalId) clearInterval(morphIntervalId);

      const W = container.clientWidth;
      const H = container.clientHeight;
      const cardW = Math.min(Math.max(50, W * 0.135), 76);
      const cardH = cardW;

      const heartPoints = calculateHeartPoints(W, H, cardW, cardH);

      heartPoints.forEach((pt, index) => {
        const div = document.createElement('div');
        div.className = 'collage-photo';
        div.style.width = cardW + 'px';
        div.style.height = cardH + 'px';
        div.style.left = pt.x + 'px';
        div.style.top = pt.y + 'px';
        div.style.setProperty('--rot', pt.rot + 'deg');
        div.style.zIndex = (index >= 18) ? 15 : (5 + (index % 6));

        const imgSrc = COLLAGE_PHOTOS[index % COLLAGE_PHOTOS.length];
        const img = document.createElement('img');
        img.className = 'collage-img';
        img.src = imgSrc;
        img.alt = 'Foto de Michelle';
        img.draggable = false;
        div.appendChild(img);

        // Tap/click to view photo enlarged
        div.addEventListener('click', () => openPhotoModal(imgSrc));

        container.appendChild(div);
        collageCardElements.push(div);

        setTimeout(() => {
          div.classList.add('show');
        }, 20 + index * 60);
      });

      // Show title after photos finish opening
      setTimeout(() => {
        title.classList.add('show');
      }, 20 + heartPoints.length * 60 + 150);

      // Start automatic 4-second morphing between Heart and 25
      currentCollageShape = 'heart';
      morphIntervalId = setInterval(() => {
        const nextShape = (currentCollageShape === 'heart') ? '25' : 'heart';
        applyCollageShape(nextShape);
      }, 4000);

      // Modal close listeners
      const modalClose = document.getElementById('modal-close');
      const modalBackdrop = document.getElementById('modal-backdrop');
      if (modalClose) modalClose.onclick = closePhotoModal;
      if (modalBackdrop) modalBackdrop.onclick = closePhotoModal;

      // Continuous floating emojis
      setInterval(() => launchEmojis(5), 4000);
    }

    /* ═══════════════════════════════════════════════════════
       INITIALIZATION
    ═══════════════════════════════════════════════════════ */
    function init() {
      generateStars('stars-bg-cat', 150);
      generateStars('stars-bg-album', 150);
      generateStars('stars-bg-collage', 150);

      buildBookAlbum();
      initBookInteraction();
      initCatScene();

      // Audio toggle button
      document.getElementById('audio-btn').addEventListener('click', toggleMusic);

      // Start button handler
      document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('start-screen').classList.add('hidden');
        showScene('matrix-scene');
        initMatrix();
        startMusic();

        setTimeout(() => {
          runCountdown();
        }, 500);
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
